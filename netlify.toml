# Netlify로 배포할 때의 설정(지금 주 배포는 Vercel, vercel.json). 보안·캐시 헤더는 빌드할 때 vercel.json을 바탕으로
# dist/_headers가 만들어져 적용된다(build/plugins.js의 cloudflareHeaders, Cloudflare Pages와 Netlify가 같은 형식을 읽는다).
# Supabase 주소와 공개용 키(VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY)는 Netlify 화면의 환경 변수에 넣는다.
# 비밀 키(service_role, sb_secret_)는 어디에도 넣지 않는다.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
